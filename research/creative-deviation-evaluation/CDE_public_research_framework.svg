<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Creative Deviation Evaluation</title><desc id="desc">Research proposal: separate artifact adoption and preference for an unintended musical change, compare restoration, then reassess.</desc><rect width="1600" height="900" fill="#0c1520"/><g font-family="Arial, sans-serif">
<text x="32" y="34" font-size="16" font-weight="700" fill="#77ddcd">GACKY-LAB / INDEPENDENT RESEARCH PROPOSAL</text>
<text x="32" y="84" font-size="44" font-weight="700" fill="#f1f5f9">Creative Deviation Evaluation (CDE)</text>
<text x="32" y="119" font-size="22" font-weight="400" fill="#b2c2ce">Beyond Acceptance: Creative Discovery and Compromise in AI-Assisted Music Editing</text>
<text x="1190" y="34" font-size="17" font-weight="700" fill="#77ddcd">v0.1 · EMPIRICALLY UNVALIDATED</text>
<rect x="32" y="140" width="1536" height="82" rx="10" fill="#172f39" stroke="#37635f"/>
<text x="52" y="172" font-size="24" font-weight="700" fill="#f1f5f9">Accepted works may contain unwanted changes.</text>
<text x="52" y="202" font-size="24" font-weight="700" fill="#f1f5f9">Rejected works may contain desirable expressions.</text>
<text x="850" y="172" font-size="21" font-weight="700" fill="#77ddcd">Separate artifact adoption from target preference,</text>
<text x="850" y="201" font-size="21" font-weight="400" fill="#edf4f7">then reassess the same comparison over time.</text>
<rect x="32" y="240" width="350" height="485" rx="10" fill="#132231" stroke="#304557"/>
<rect x="394" y="240" width="612" height="485" rx="10" fill="#132231" stroke="#304557"/>
<rect x="1018" y="240" width="550" height="485" rx="10" fill="#132231" stroke="#304557"/>
<text x="50" y="273" font-size="19" font-weight="700" fill="#77ddcd">01 / OBSERVATION FIELDS</text>
<rect x="50" y="296" width="34" height="34" rx="10" fill="#1d3040" stroke="#304557"/>
<text x="60" y="319" font-size="21" font-weight="700" fill="#77ddcd">A</text>
<text x="96" y="315" font-size="20" font-weight="700" fill="#f1f5f9">Prospective intent</text>
<text x="50" y="353" font-size="15" font-weight="400" fill="#b2c2ce">Change / preserve / delegate / unspecified</text>
<path d="M50 362H364" stroke="#304557"/>
<rect x="50" y="377" width="34" height="34" rx="10" fill="#1d3040" stroke="#304557"/>
<text x="60" y="400" font-size="21" font-weight="700" fill="#77ddcd">B</text>
<text x="96" y="396" font-size="20" font-weight="700" fill="#f1f5f9">Observed change</text>
<text x="50" y="434" font-size="15" font-weight="400" fill="#b2c2ce">Changed / unchanged / unknown</text>
<path d="M50 443H364" stroke="#304557"/>
<rect x="50" y="458" width="34" height="34" rx="10" fill="#1b3b40" stroke="#304557"/>
<text x="60" y="481" font-size="21" font-weight="700" fill="#77ddcd">C</text>
<text x="96" y="477" font-size="20" font-weight="700" fill="#f1f5f9">Artifact adoption</text>
<text x="50" y="515" font-size="15" font-weight="400" fill="#b2c2ce">Accept / hold / reject</text>
<path d="M50 524H364" stroke="#304557"/>
<rect x="50" y="539" width="34" height="34" rx="10" fill="#1b3b40" stroke="#304557"/>
<text x="60" y="562" font-size="21" font-weight="700" fill="#77ddcd">D</text>
<text x="96" y="558" font-size="20" font-weight="700" fill="#f1f5f9">Restoration preference</text>
<text x="50" y="596" font-size="15" font-weight="400" fill="#b2c2ce">Edited / restored / tie / unsure</text>
<path d="M50 605H364" stroke="#304557"/>
<rect x="50" y="620" width="34" height="34" rx="10" fill="#1b3b40" stroke="#304557"/>
<text x="60" y="643" font-size="21" font-weight="700" fill="#77ddcd">E</text>
<text x="96" y="639" font-size="20" font-weight="700" fill="#f1f5f9">Temporal pattern</text>
<text x="50" y="677" font-size="15" font-weight="400" fill="#b2c2ce">Derived from repeated D observations</text>
<text x="412" y="273" font-size="21" font-weight="700" fill="#77ddcd">02 / CREATIVE DEVIATION MATRIX</text>
<text x="412" y="299" font-size="16" font-weight="400" fill="#b2c2ce">Verified change to a prospectively preserved target only.</text>
<text x="432" y="329" font-size="15" font-weight="700" fill="#b2c2ce">RESTORED PREFERRED</text>
<text x="719" y="329" font-size="15" font-weight="700" fill="#b2c2ce">EDITED PREFERRED</text>
<rect x="412" y="342" width="286" height="124" rx="10" fill="#3a3026" stroke="#f1cb91"/>
<text x="424" y="365" font-size="15" font-weight="700" fill="#f1cb91">CDE-02 / ACCEPT</text>
<text x="424" y="394" font-size="21" font-weight="700" fill="#f1cb91">Compromised adoption</text>
<text x="424" y="424" font-size="16" font-weight="400" fill="#edf4f7">Accept work; prefer restoration.</text>
<text x="424" y="448" font-size="15" font-weight="400" fill="#b2c2ce">Candidate classification</text>
<rect x="702" y="342" width="286" height="124" rx="10" fill="#173b3b" stroke="#77ddcd"/>
<text x="714" y="365" font-size="15" font-weight="700" fill="#77ddcd">CDE-01 / ACCEPT</text>
<text x="714" y="394" font-size="21" font-weight="700" fill="#77ddcd">Creative discovery</text>
<text x="714" y="424" font-size="16" font-weight="400" fill="#edf4f7">Accept work; prefer change.</text>
<text x="714" y="448" font-size="15" font-weight="400" fill="#b2c2ce">Candidate classification</text>
<rect x="412" y="475" width="286" height="124" rx="10" fill="#392b32" stroke="#f0b3ac"/>
<text x="424" y="498" font-size="15" font-weight="700" fill="#f0b3ac">CDE-04 / REJECT</text>
<text x="424" y="527" font-size="21" font-weight="700" fill="#f0b3ac">Unintended loss</text>
<text x="424" y="557" font-size="16" font-weight="400" fill="#edf4f7">Reject work; prefer restoration.</text>
<text x="424" y="581" font-size="15" font-weight="400" fill="#b2c2ce">Candidate classification</text>
<rect x="702" y="475" width="286" height="124" rx="10" fill="#20384b" stroke="#acd0f4"/>
<text x="714" y="498" font-size="15" font-weight="700" fill="#acd0f4">CDE-03 / REJECT</text>
<text x="714" y="527" font-size="21" font-weight="700" fill="#acd0f4">Partial discovery</text>
<text x="714" y="557" font-size="16" font-weight="400" fill="#edf4f7">Reject work; prefer change.</text>
<text x="714" y="581" font-size="15" font-weight="400" fill="#b2c2ce">Candidate classification</text>
<text x="412" y="637" font-size="17" font-weight="400" fill="#b2c2ce">CDE-U: holds, ties, missing or insufficient evidence.</text>
<text x="412" y="662" font-size="17" font-weight="400" fill="#b2c2ce">Candidate labels are not psychological diagnoses.</text>
<text x="412" y="687" font-size="17" font-weight="400" fill="#77ddcd">Record creator's reasons separately.</text>
<text x="1036" y="273" font-size="21" font-weight="700" fill="#77ddcd">03 / CONTROLLED RESTORATION</text>
<text x="1036" y="307" font-size="20" font-weight="400" fill="#edf4f7">1  Record intention before editing.</text>
<text x="1036" y="342" font-size="20" font-weight="400" fill="#edf4f7">2  Verify change; record artifact adoption.</text>
<rect x="1036" y="358" width="248" height="84" rx="10" fill="#1a2e3e" stroke="#407570"/>
<rect x="1294" y="358" width="256" height="84" rx="10" fill="#1a2e3e" stroke="#405b70"/>
<text x="1048" y="383" font-size="18" font-weight="700" fill="#77ddcd">EDITED</text>
<text x="1048" y="407" font-size="17" font-weight="400" fill="#edf4f7">New lyrics + changed</text>
<text x="1048" y="430" font-size="17" font-weight="400" fill="#edf4f7">vibrato</text>
<text x="1306" y="383" font-size="18" font-weight="700" fill="#acd0f4">RESTORED</text>
<text x="1306" y="407" font-size="17" font-weight="400" fill="#edf4f7">Same lyrics + original</text>
<text x="1306" y="430" font-size="17" font-weight="400" fill="#edf4f7">vibrato</text>
<text x="1036" y="474" font-size="20" font-weight="400" fill="#edf4f7">3  Compare matched variants; randomize order.</text>
<text x="1036" y="509" font-size="20" font-weight="400" fill="#edf4f7">4  Repeat after a prespecified interval.</text>
<text x="1036" y="548" font-size="18" font-weight="700" fill="#77ddcd">INITIAL → DELAYED</text>
<rect x="1036" y="560" width="248" height="32" rx="10" fill="#1b2c3b" stroke="#304557"/>
<text x="1045" y="582" font-size="15" font-weight="700" fill="#77ddcd">S1</text>
<text x="1078" y="582" font-size="16" font-weight="400" fill="#edf4f7">Edited → Edited</text>
<rect x="1294" y="560" width="248" height="32" rx="10" fill="#1b2c3b" stroke="#304557"/>
<text x="1303" y="582" font-size="15" font-weight="700" fill="#77ddcd">S2</text>
<text x="1336" y="582" font-size="16" font-weight="400" fill="#edf4f7">Edited → Restored</text>
<rect x="1036" y="598" width="248" height="32" rx="10" fill="#1b2c3b" stroke="#304557"/>
<text x="1045" y="620" font-size="15" font-weight="700" fill="#77ddcd">S3</text>
<text x="1078" y="620" font-size="16" font-weight="400" fill="#edf4f7">Restored → Edited</text>
<rect x="1294" y="598" width="248" height="32" rx="10" fill="#1b2c3b" stroke="#304557"/>
<text x="1303" y="620" font-size="15" font-weight="700" fill="#77ddcd">S4</text>
<text x="1336" y="620" font-size="16" font-weight="400" fill="#edf4f7">Restored → Restored</text>
<text x="1036" y="657" font-size="16" font-weight="400" fill="#b2c2ce">SU: ties / missing / uncertain observations.</text>
<text x="1036" y="681" font-size="15" font-weight="400" fill="#b2c2ce">Unit: creator × artifact/edit episode × target change.</text>
<text x="1036" y="705" font-size="16" font-weight="400" fill="#b2c2ce">Uncontrolled comparisons are recorded separately.</text>
<rect x="32" y="742" width="1536" height="92" rx="10" fill="#132231" stroke="#304557"/>
<text x="50" y="769" font-size="18" font-weight="700" fill="#77ddcd">04 / PROPOSED KNOWLEDGE REUSE</text>
<text x="50" y="808" font-size="21" font-weight="400" fill="#edf4f7">Intent / editing history</text>
<text x="525" y="808" font-size="21" font-weight="700" fill="#77ddcd">→   Music analysis + CDE evidence</text>
<text x="1070" y="808" font-size="21" font-weight="400" fill="#edf4f7">→   Subsequent creative decisions</text>
<text x="32" y="865" font-size="18" font-weight="700" fill="#77ddcd">Human-led creativity. Evidence-driven understanding.</text>
<text x="835" y="857" font-size="15" font-weight="400" fill="#b2c2ce">Related work: Cococo · AMUSE · MuseCPBench · SMEBench · Repeated Listening</text>
<text x="835" y="880" font-size="15" font-weight="400" fill="#b2c2ce">Research proposal only. No empirical effect or priority claim.</text>
</g></svg>
